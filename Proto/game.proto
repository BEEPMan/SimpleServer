syntax = "proto3";
package Protocol;

// 공통 타입
message Vector3 {
    float x = 1;
    float y = 2;
    float z = 3;
}

message PlayerInfo {
    uint64  player_id = 1;
    string  name      = 2;
    Vector3 position  = 3;
    float   yaw       = 4;
    float   pitch     = 5;
}

// C_ENTER_GAME: 클라이언트 → 서버, 닉네임으로 입장 요청
message C_EnterGame {
    string name = 1;
}

// S_ENTER_GAME: 서버 → 클라이언트, 입장 결과 (내 플레이어 정보 포함)
message S_EnterGame {
    bool       success = 1;
    PlayerInfo my_info = 2;
}

// S_SPAWN: 서버 → 클라이언트, 새 플레이어 등장 알림
message S_Spawn {
    repeated PlayerInfo players = 1;
}

// S_DESPAWN: 서버 → 클라이언트, 플레이어 퇴장 알림
message S_Despawn {
    repeated uint64 player_ids = 1;
}

// C_MOVE: 클라이언트 → 서버, 이동 요청
message C_Move {
    Vector3 position = 1;
    float   yaw      = 2;
    float   pitch    = 3;
}

// S_MOVE: 서버 → 클라이언트, 이동 결과 전파
message S_Move {
    uint64  player_id = 1;
    Vector3 position  = 2;
    float   yaw       = 3;
    float   pitch     = 4;
}

// C_CHAT: 클라이언트 → 서버, 채팅 전송
message C_Chat {
    string message = 1;
}

// S_CHAT: 서버 → 클라이언트, 채팅 수신
message S_Chat {
    uint64 player_id = 1;
    string name      = 2;
    string message   = 3;
}

// S_PLAYER_LIST: 서버 → 클라이언트, 현재 접속 중인 플레이어 목록
message S_PlayerList {
    repeated PlayerInfo players = 1;
}

// C_PING / S_PONG: 테스트용
message C_Ping {}
message S_Pong {}

// C_INPUT_CMD: 클라이언트 → 서버, 틱 입력 커맨드 (Client Prediction용)
message C_InputCmd {
    uint32 tick        = 1;  // 클라이언트 틱 번호
    int32  move_x      = 2;  // 좌우 이동 (-127 ~ 127 양자화)
    int32  move_z      = 3;  // 전후 이동 (-127 ~ 127 양자화)
    int32  yaw_delta   = 4;  // yaw 변화량 (0.01° 단위)
    int32  pitch_delta = 5;  // pitch 변화량 (0.01° 단위, 서버는 무시)
    bool   jump        = 6;  // 점프 입력
}

// S_PLAYER_STATE: 서버 → 클라이언트, 플레이어 물리 상태 (Server Reconciliation용)
message S_PlayerState {
    uint64 player_id   = 1;
    uint32 tick        = 2;  // 처리된 마지막 틱 번호
    Vector3 position   = 3;
    float  yaw         = 4;
    float  vert_vel    = 5;  // 수직 속도 (m/s)
    bool   is_grounded = 6;
}
